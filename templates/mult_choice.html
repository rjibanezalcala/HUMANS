{% extends 'trial.html' %}


{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-9 col-xl-8">
        <h6>Select the one thing out of the options that you want most right now (you can only select one thing).</h6>
    </div>
</div>
{% endblock %}

{% block button %}
<div class="row justify-content-center">
    <div class="col-lg-9 col-xl-8">
        <div class='center'>
            <div class="question-block">
                <h2> Question {{trial_number}} </h2>

                <form method = "POST">
                    {% for choice in choices %}
                    <div>
                        <label class="mult">
                            <input type="radio" name="value" value="{{ loop.index0 }}" required>
                            {{ choice }}
                        </label>
                    </div>
                    {% endfor %}
                    <br> 

                    <input type="submit" class="btn btn-primary" value="Submit" id="submitBtn" disabled>
                
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const submitBtn = document.getElementById('submitBtn');
        setTimeout(function () {
            submitBtn.disabled = false;
        }, {{ timeout | tojson }});
    });
</script>

{% endblock %}
