{% extends 'base.html' %}

{% block header %}

{% endblock %}

{% block subheader %}

<h2> Please input the following: </h2>

{% endblock %}

{% block content %}

<div class='center2'>
	<form method="post">
		<div class="personal-info" id="demographics">
			<span class="instructions"></span>
			
			<label for="sex">Sex assigned at birth:</label> </dt>
			<select name="sex" id="sex" title="The sex that was assigned to you at birth (required)." required>
				<option class="select-option" value="" disabled selected>Select one</option>
				<option class="select-option" value="male">Male</option>
				<option class="select-option" value="female">Female</option>
				<option class="select-option" value="intersex">Intersex</option>
				<option class="select-option" value="undisclosed">Prefer not to disclose</option>
			</select>

			<label for="gender">Gender identity (optional):</label> </dt>
			<input type="text" name="gender" id="gender" placeholder="(optional)">


			<div class="slider-block">
				<br><br><label for="hunger">How hungry are you?</label>
				<div class="slider slider-narrow">
					<input type="range" min="0" max="10" value="5" step="1" name="hunger" oninput="hungerValue.textContent = this.value" id="responseSlider">

					<!-- Slider labels -->
					<div class="d-flex justify-content-between mb-1">
						<span>Not at all</span>
						<span>A lot</span>
					</div>
					<div class="d-flex justify-content-between small text-secondary mb-4">
						<span>0</span>
						<span>10</span>
					</div>

					<div style="text-align:center; margin-top:1px;">
						Current value: <output id="hungerValue">5</output>
					</div>
				</div>
			</div>
			<br><br>

			<div class="slider-block">
				<br><br><label for="hunger">How tired are you?</label>
				<div class="slider slider-narrow">
					<input type="range" min="0" max="10" value="5" step="1" name="tired" oninput="tiredValue.textContent = this.value" id="responseSlider">

					<!-- Slider labels -->
					<div class="d-flex justify-content-between mb-1">
						<span>Not at all</span>
						<span>A lot</span>
					</div>
					<div class="d-flex justify-content-between small text-secondary">
						<span>0</span>
						<span>10</span>
					</div>

					<div style="text-align:center; margin-top:1px;">
						Current value: <output id="tiredValue">5</output>
					</div>
				</div>
			</div>
		</div>
		<input type="submit" class="btn btn-primary" value="Submit"/>
	</form>
</div>

{%endblock %}
