{% extends 'base.html' %}

{% block header %}

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <!-- <div class="card shadow"> 
        <div class="card-body p-4">-->

          <h2 class="text-center mb-4">Instructions (Section 2 of 5)</h2>

          <p>In this second section, you will be shown some more items. As in the first section, please indicate your personal preference using the provided slider.</p>


          <div class="text-center mt-4">
            <form method="POST">
              <input type="submit" id="submitBtn" class="btn btn-primary btn-lg" value="Continue" disabled>
            </form>
          </div>

        <!-- </div>
      </div> -->
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const submitBtn = document.getElementById('submitBtn');

    setTimeout(function () {
        submitBtn.disabled = false;
    }, 5000);
});
</script>
{% endblock %}
