{% extends 'base.html' %}

{% block header %}
{% include 'message.html' %}
{% endblock %}

{% block content %}

<div class = 'center'>
	<h3> Are you sure you want to reset the session?<br></h3>
	<form method = "POST" name="reset">
		<input type="submit" value="Yes, reset and restart session" 
			name="yes_reset" id="yes_reset" class="btn btn-primary"/>

		<input type="submit" value="No, go back to session" 
			name="no_reset" id="no_reset" class="btn btn-primary"/>
	</form>
</div>

{%endblock %}
